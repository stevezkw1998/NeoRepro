[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "neorepro"
version = "0.1.0.dev0"
description = "Reproducibility and patient-level evaluation of public neoantigen predictors"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{name = "NeoRepro contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
analysis = ["matplotlib>=3.8", "numpy>=1.26", "openpyxl>=3.1", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.4", "seaborn>=0.13"]

[project.scripts]
neorepro = "neorepro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neorepro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
